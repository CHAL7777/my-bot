services:
  bot:
    build: .
    container_name: telegram-quiz-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_IDS=${ADMIN_IDS}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - quiz-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    command: python app/main.py

  db:
    image: mariadb:10.6
    container_name: quiz-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database_setup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - quiz-network
    ports:
      - "3307:3306"

  redis:
    image: redis:7-alpine
    container_name: quiz-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - quiz-network
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - quiz-network
    depends_on:
      - db

volumes:
  db_data:
  redis_data:

networks:
  quiz-network:
    driver: bridge

